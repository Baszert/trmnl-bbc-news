---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: ''
polling_url: "{% if feed == \"top\" %}\r\nhttps://feeds.bbci.co.uk/news/rss.xml\r\n{% elsif feed == \"world\" %}\r\nhttps://feeds.bbci.co.uk/news/world/rss.xml\r\n{% elsif feed == \"uk\" %}\r\nhttps://feeds.bbci.co.uk/news/uk/rss.xml\r\n{% elsif feed == \"business\" %}\r\nhttps://feeds.bbci.co.uk/news/business/rss.xml\r\n{% elsif feed == \"politics\" %}\r\nhttps://feeds.bbci.co.uk/news/politics/rss.xml\r\n{% elsif feed == \"health\" %}\r\nhttps://feeds.bbci.co.uk/news/health/rss.xml\r\n{% elsif feed == \"edu\" %}\r\nhttps://feeds.bbci.co.uk/news/education/rss.xml\r\n{% elsif feed == \"science\" %}\r\nhttps://feeds.bbci.co.uk/news/science_and_environment/rss.xml\r\n{% elsif feed == \"tech\" %}\r\nhttps://feeds.bbci.co.uk/news/technology/rss.xml\r\n{% elsif feed == \"entertainment\" %}\r\nhttps://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml\r\n{% else %}\r\nhttps://feeds.bbci.co.uk/news/world/rss.xml\r\n{% endif %}"
polling_headers: ''
polling_body: ''
id: 206768
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- name: About this plugin
  keyname: author_bio
  field_type: author_bio
  description: Get the latest headlines from the BBC News. Select a feed and get updated. <br><br> Questions or ideas? Email me or reach out on Discord at @Bas/@Bastronautica.
  category: calendar
  email_address: trmnl@achtnegen.nl
- name: News feed
  description: Select the feed you would like to show
  keyname: feed
  field_type: select
  options:
  - Top Stories: top
  - World: world
  - UK: uk
  - Business: business
  - Politics: politics
  - Health: health
  - Education and Family: edu
  - Science and Envoironment: science
  - Tech: tech
  - Entertainment and Arts: entertainment
  default: world
name: BBC News - News feed
description: Show the latest news from the BBC
refresh_interval: 60
